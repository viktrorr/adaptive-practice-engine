[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-practice-engine"
version = "0.1.0"
description = "A reproducible learning-event pipeline and adaptive language-practice API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
llm = ["openai>=1.70,<3"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

